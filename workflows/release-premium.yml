# Deploy Premium Backcourt Plugin.
# Version: 1.4.0
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    tags:
      # Semver (https://semver.org/) release pattern.
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Build distribution release.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up PHP with Composer and WP-CLI.
  # - Logs debug information.
  # - Get Composer Cache Directory.
  # - Sets up Composer Caching.
  # - Logs debug information.
  # - Setup NodeJS.
  # - Get NPM cache directory.
  # - Sets up NPM Caching.
  # - Install NPM dependencies.
  # - Get release version.
  # - Check for Alpha release.
  # - Check for Beta release.
  # - Check for Release Candidate release.
  # - Logs debug information.
  # - Build release:
  #    - Pre-release.
  #    - Stable.
  # - Verify release zip exists.
  # - Verify prefixed dependencies are in the release zip.
  # - Deploy to WooCommerce.
  # - Rename zip for GitHub release.
  # - Extract release notes from changelog.txt.
  # - Add package to GitHub releases.

  dist:
    name: "Build distribution release."
    runs-on: ubuntu-latest
    env:
      release: stable
      # Release builds never need the require-dev packages. Strauss comes from composer.json's prefix-namespaces script.
      COMPOSER_NO_DEV: 1
    steps:

      - name: "Checks out the repository."
        uses: "actions/checkout@v7"

      - name: "Sets up PHP with Composer and WP-CLI."
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Get Composer Cache Directory."
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "Sets up Composer Caching."
        uses: "actions/cache@v6"
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-composer-build-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-composer-build-

      - name: "Logs debug information."
        run: |
          php --version
          composer --version
          wp --version
          # The wp-cli phar bundles i18n-command, which `composer run makepot` needs.
          wp i18n make-pot --help > /dev/null

      - name: "Setup NodeJS."
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: "Get NPM cache directory."
        id: npm-cache-dir
        run: |
          echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: "Sets up NPM Caching."
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-npm-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-npm-build-

      - name: "Install NPM dependencies."
        run: npm install

      - name: "Get release version."
        run: |
          echo "release_tag=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

      - name: "Get release file base name."
        run: |
          echo "release_name=$(node -p -e "require('./package.json').name")" >> $GITHUB_ENV

      - name: "Check for Alpha release."
        if: ${{ contains(env.release_tag, '-alpha') }}
        run: |
          echo "release_status=pre-release" >> $GITHUB_ENV

      - name: "Check for Beta release."
        if: ${{ contains(env.release_tag, '-beta') }}
        run: |
          echo "release_status=pre-release" >> $GITHUB_ENV

      - name: "Check for Release Candidate release."
        if: ${{ contains(env.release_tag, '-rc') }}
        run: |
          echo "release_status=pre-release" >> $GITHUB_ENV

      - name: "Logs debug information."
        run: |
          node --version
          npm --version
          echo ${{ env.release_tag }}
          echo ${{ env.release_status }}

      - name: "Build release: Pre-release"
        if: ${{ env.release_status == 'pre-release' }}
        run: |
          npm run betarelease

      - name: "Build release: Stable"
        if: ${{ env.release_status != 'pre-release' }}
        run: |
          npm run release

      - name: "Verify release zip exists"
        run: |
          echo "Checking for release zip…"
          ls -lh ./deploy || true
          if [ ! -f "./deploy/${{ env.release_name }}.zip" ]; then
            echo "::error::Release zip not found at ./deploy/${{ env.release_name }}.zip"
            exit 1
          fi

      - name: "Verify prefixed dependencies are in the release zip"
        run: |
          zip="./deploy/${{ env.release_name }}.zip"
          if ! unzip -Z1 "$zip" | grep -qx "${{ env.release_name }}/vendor-prefixed/autoload.php"; then
            echo "::error::vendor-prefixed/autoload.php is missing from the release zip."
            exit 1
          fi
          if unzip -Z1 "$zip" | grep -q "^${{ env.release_name }}/vendor/afragen"; then
            echo "::error::Unprefixed vendor/afragen packages found in the release zip."
            exit 1
          fi
          if unzip -Z1 "$zip" | grep -q "strauss.phar"; then
            echo "::error::strauss.phar must not ship in the release zip."
            exit 1
          fi

      - name: "Deploy to WooCommerce"
        if: ${{ env.release_status != 'pre-release' }}
        run: |
          curl -X POST https://woocommerce.com/wp-json/wc/submission/runner/v1/product/deploy \
            -F "file=@./deploy/${{ env.release_name }}.zip" \
            -F "product_id=853021" \
            -F "username=${{ secrets.WCCOM_SUBMISSIONS_USERNAME }}" \
            -F "password=${{ secrets.WCCOM_SUBMISSIONS_PASSWORD }}" \
            -F "version=${{ env.release_tag }}"

      - name: "Rename zip for GitHub release."
        run: |
          cp ./deploy/${{ env.release_name }}.zip ./deploy/${{ env.release_name }}-${{ env.release_tag }}.zip

      - name: "Extract release notes from changelog.txt."
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          # Print the lines under "<date> - version <release_tag>" up to the next version heading, then trim trailing blank lines.
          awk -v ver="${{ env.release_tag }}" '
            { sub(/\r$/, "") }
            /^[^ ]+ - version / { if (found) exit; if ($NF == ver) { found = 1; next } }
            found { print }
          ' changelog.txt | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::warning::No changelog.txt entry found for version ${{ env.release_tag }}. The release body will be empty."
          fi
          echo "release_notes=$notes" >> $GITHUB_ENV

      - name: "Add package to GitHub releases."
        uses: softprops/action-gh-release@v3
        with:
          files: ./deploy/${{ env.release_name }}-${{ env.release_tag }}.zip
          body_path: ${{ env.release_notes }}
          prerelease: ${{ env.release_status == 'pre-release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}